name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test & package
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pomodoro
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: pomodoro-server/pom.xml

      - name: Initialize database
        run: mysql -h 127.0.0.1 -uroot -proot < pomodoro-server/sql/schema.sql

      - name: Run tests
        working-directory: pomodoro-server
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DB: pomodoro
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: mvn -B test

      - name: Package jar
        working-directory: pomodoro-server
        run: mvn -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-server-jar
          path: pomodoro-server/target/pomodoro-server.jar
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./pomodoro-server
          push: false
          tags: pomodoro-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
