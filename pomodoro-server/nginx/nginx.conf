# 番茄钟 · AI 效率分析系统 —— 生产入口 Nginx
#
# 职责：① 托管 H5 静态资源；② 把 /api 反代到后端应用；③ 挡住不该对外的运维端点。
# 挂载位置（见 docker-compose.prod.yml）：/etc/nginx/conf.d/default.conf
#
# 编写时踩到的两个 nginx 语义坑，改动本文件前请先看：
#   1) SSE 必须 proxy_buffering off，否则事件帧被攒在缓冲区里，前端要等整条流结束
#      才一次性收到，「流式」等于白做（见 /api/ai/weekly-report/stream）；
#   2) add_header 是「全有或全无」的继承：只要某个 location 里写了任意一条 add_header，
#      它就完全不再继承 server 级的头部。所以下面凡是用到 add_header 的 location，
#      都把安全响应头重新写了一遍——否则 index.html 会丢掉防点击劫持的 X-Frame-Options。

upstream pomodoro_app {
    # 同一 compose 网络内按服务名解析；只有 nginx 能访问它，应用端口不对宿主机发布
    server app:8080;
    keepalive 32;
}

# 运维端点只允许内网：Prometheus 直接抓 app:8080，正常不需要经过本入口
geo $actuator_allowed {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

server {
    listen 80;
    server_name _;

    # ---------- 通用加固 ----------
    server_tokens off;                      # 不回显 Nginx 版本号
    client_max_body_size 2m;                # 业务请求体都是小 JSON，无需更大
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always; # 本应用不需要被任何页面嵌套
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP 需要先确认 uni-app H5 产物里的内联样式与脚本，贸然开启会把页面打白，
    # 因此留作上线前的待办（见 README 后续优化方向）。
    # add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 运维端点 ----------
    location ^~ /actuator {
        if ($actuator_allowed = 0) {
            return 404;    # 对外表现成「不存在」，不暴露这里有监控端点
        }
        proxy_pass http://pomodoro_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SSE 流式周报（exact 匹配，必须先于通用 /api/ 生效） ----------
    location = /api/ai/weekly-report/stream {
        proxy_pass http://pomodoro_app;
        proxy_http_version 1.1;                 # SSE 要长连接
        proxy_set_header Connection "";         # 清掉 close，交给 keepalive 复用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端按 X-Forwarded-For 还原真实客户端 IP 做登录限流（见 application-prod.yml）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                    # 关键：不缓冲，事件帧产生即下发
        proxy_cache off;
        proxy_read_timeout 300s;                # 后端 SseEmitter 超时 120s，留出余量
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # 其余客户端请求头（如前端主动带的 X-Trace-Id 用于链路对齐）默认原样转发，
        # 无需显式 proxy_set_header；后端还会对 traceId 做白名单校验后才采纳。
    }

    # ---------- 业务接口 ----------
    location /api/ {
        proxy_pass http://pomodoro_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---------- H5 静态资源 ----------
    location / {
        # uni-app H5 默认 hash 路由，回落 index.html 即可兼顾 history 模式
        try_files $uri $uri/ /index.html;
    }

    # 构建产物文件名带 hash，可长期强缓存（注意：这里写了 add_header，
    # 上面 server 级的安全头不会继承，故重复声明）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # 入口页每次校验，避免发版后用户拿到旧页面对不上新接口
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }
}