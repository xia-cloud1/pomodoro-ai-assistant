server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pomodoro-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pomodoro}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  type-aliases-package: com.pomodoro.entity

# 日志
logging:
  level:
    com.pomodoro: info
  pattern:
    # 每条日志带上请求 traceId，便于按一次请求串联 WebLogAspect / 业务异常 / SQL 日志
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %-40.40logger{39} : %msg%n"

# 可观测性：Actuator + Micrometer
management:
  endpoints:
    web:
      exposure:
        # 生产环境应收紧为 health,prometheus，其余经内网/网关访问
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # Redis 为可选依赖（未装时 refresh token 走内存降级），
    # 不能让它的 DOWN 把整体健康状态拖成 DOWN
    redis:
      enabled: false
  info:
    # Boot 2.6 起 info.* 默认不暴露，需显式开启
    env:
      enabled: true
  metrics:
    tags:
      # 所有指标带应用名，方便 Prometheus 多服务区分
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: 番茄钟 · AI 效率分析系统
    version: @project.version@

# JWT 配置
jwt:
  # 生产环境务必替换为随机长字符串（>= 32 字节）
  secret: ${JWT_SECRET:pomodoro-ai-efficiency-system-jwt-secret-key-please-change-me-2026}
  # access token 有效期（秒），默认 2 小时
  access-expire: 7200
  # refresh token 有效期（秒），默认 7 天
  refresh-expire: 604800
  # 请求头名称
  header: Authorization
  # token 前缀
  prefix: "Bearer "

# DeepSeek（OpenAI 兼容协议）配置
deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  # 连接与读取超时（毫秒）
  connect-timeout: 10000
  read-timeout: 120000
