server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pomodoro-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pomodoro}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  type-aliases-package: com.pomodoro.entity

# 日志
logging:
  level:
    com.pomodoro: info

# JWT 配置
jwt:
  # 生产环境务必替换为随机长字符串（>= 32 字节）
  secret: ${JWT_SECRET:pomodoro-ai-efficiency-system-jwt-secret-key-please-change-me-2026}
  # access token 有效期（秒），默认 2 小时
  access-expire: 7200
  # refresh token 有效期（秒），默认 7 天
  refresh-expire: 604800
  # 请求头名称
  header: Authorization
  # token 前缀
  prefix: "Bearer "

# DeepSeek（OpenAI 兼容协议）配置
deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  # 连接与读取超时（毫秒）
  connect-timeout: 10000
  read-timeout: 120000
