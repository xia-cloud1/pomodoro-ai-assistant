# 生产部署覆盖文件：直接使用 CI 推送到 GHCR 的镜像，不在服务器上构建；
# 并叠加一个 Nginx 作为唯一对外入口（托管 H5 静态资源 + 反代 /api）。
#
# 前置：在 HBuilderX 里「发行 → 网站-H5」生成发行包，产物默认在
#       unpackage/dist/build/h5（本文件按该相对路径挂载）。
#
# 用法（在 pomodoro-server 目录）：
#   cp .env.example .env && vi .env       # 至少填 JWT_SECRET 与 MYSQL_PASSWORD
#   echo $CR_PAT | docker login ghcr.io -u <GitHub 用户名> --password-stdin
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# 必需环境变量（缺失直接启动失败，见 application-prod.yml 与 JwtSecretGuard）：
#   JWT_SECRET       —— 随机长字符串，>= 32 字节；用仓库默认值会拒绝启动
#   MYSQL_PASSWORD   —— 数据库 root 密码
# 可选：IMAGE_TAG（默认 latest）、DEEPSEEK_API_KEY、CORS_ALLOWED_ORIGINS
services:
  app:
    image: ghcr.io/xia-cloud1/pomodoro-ai-assistant:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      # prod profile 收紧 Actuator 暴露面、要求显式密钥、按 X-Forwarded-For 还原真实 IP
      SPRING_PROFILES_ACTIVE: prod
      # `:?` 让变量缺失时 docker compose 直接报错退出，而不是悄悄用默认值启动——
      # 生产用公开的默认密钥签发 token 等于没有认证
      JWT_SECRET: ${JWT_SECRET:?生产部署必须设置 JWT_SECRET（随机长字符串，>= 32 字节）}

  nginx:
    image: nginx:1.27-alpine
    container_name: pomodoro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # H5 发行包（HBuilderX「发行 → 网站-H5」产物）。
      # 目录名随 HBuilderX 版本不同：老版本是 unpackage/dist/build/h5，较新版本是 .../web。
      # 部署前用 `ls ../unpackage/dist/build` 确认一下，不是 h5 就把下面这行改掉。
      - ../unpackage/dist/build/h5:/usr/share/nginx/html:ro
    depends_on:
      - app